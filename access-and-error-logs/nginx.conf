# nginx in front of PHP. It writes a line to logs/access.log for every request,
# and a line to logs/error.log when something goes wrong on its side.
server {
    listen 80;

    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;

    location / {
        proxy_pass http://php:8000;
        proxy_set_header Host $http_host;

        # Give up on PHP after 3 seconds, not the default 60.
        proxy_connect_timeout 3s;
    }
}
