# PHP's built-in server, serving only public/, with nginx in front of it.
# Both write their logs into ./logs, outside the web root.
services:
  php:
    image: php:8.4-cli
    # Show visitors nothing; write errors to the log instead.
    command: >
      php -d display_errors=0 -d log_errors=1 -d error_log=/app/logs/php-error.log
      -S 0.0.0.0:8000 -t public
    working_dir: /app
    volumes:
      - ./:/app

  proxy:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs:/var/log/nginx
    ports:
      - "${PROXY_PORT:-8000}:80"
    depends_on:
      - php
