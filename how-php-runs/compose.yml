# nginx on port 8000, and PHP-FPM behind it on port 9000, inside Docker's
# network only. Both see the code at the same path, /app.
services:
  php:
    image: php:8.4-fpm
    volumes:
      - ./:/app

  web:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/app/public:ro
    ports:
      - "${WEB_PORT:-8000}:80"
    depends_on:
      - php
