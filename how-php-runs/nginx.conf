# nginx serves the files itself, and hands .php files to PHP-FPM.
server {
    listen 80;
    root /app/public;
    index index.php;

    # A file that exists, like style.css, nginx sends as it is.
    # Anything else goes to index.php.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # .php files go to PHP-FPM, over FastCGI, on port 9000.
    location ~ \.php$ {
        # Only run .php files that really exist.
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php:9000;
    }
}
