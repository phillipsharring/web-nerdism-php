# MySQL, a container to run the script by hand, and (with --profile cron) one
# running the cron daemon. The passwords here are for this local example only.
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: course
      MYSQL_USER: app
      MYSQL_PASSWORD: app-password
      MYSQL_ROOT_PASSWORD: root-password
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uapp", "-papp-password"]
      interval: 2s
      retries: 60

  app:
    build: .
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      DB_HOST: db
      DB_NAME: course
      DB_USER: app
      DB_PASSWORD: app-password
    depends_on:
      db:
        condition: service_healthy
    profiles: [manual]

  cron:
    build:
      context: .
      dockerfile: Dockerfile.cron
    volumes:
      - ./:/app
    depends_on:
      db:
        condition: service_healthy
    profiles: [cron]
