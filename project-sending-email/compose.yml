# Mailpit catches every email sent to it and shows it in a web page. Nothing
# leaves your computer. The PHP container sends to it, by its service name.
services:
  mailpit:
    image: axllent/mailpit:v1.30.5
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  php:
    image: php:8.4-cli
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      - mailpit
