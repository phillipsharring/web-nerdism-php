# MySQL 8.4, and a PHP container that can talk to it. init.sql runs once,
# the first time the database starts. The passwords are pretend ones, for
# this example on your own computer only.
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root-password
      MYSQL_DATABASE: course
      MYSQL_USER: app
      MYSQL_PASSWORD: app-password
      # The mysql client picks its character set from the locale. Without this,
      # it assumes latin1 and mangles anything that isn't plain English.
      LANG: C.UTF-8
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "app", "-papp-password", "--silent"]
      interval: 2s
      timeout: 5s
      retries: 60

  php:
    build: .
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      DB_HOST: db
      DB_NAME: course
      DB_USER: app
      DB_PASSWORD: app-password
    depends_on:
      db:
        condition: service_healthy
