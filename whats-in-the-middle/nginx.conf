# The reverse proxy: take every request, pass it to PHP, pass the answer back.
server {
    listen 80;

    location / {
        proxy_pass http://php:8000;

        # Tell PHP what the proxy saw, since PHP only sees the proxy.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Mark every answer, so you can see it came through here.
        add_header X-Passed-Through proxy always;
    }
}
