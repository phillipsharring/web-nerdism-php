# Two containers: PHP's built-in server, and a reverse proxy in front of it.
# The proxy is on port 8000. PHP is also on 8001, so you can skip the proxy.
services:
  php:
    image: php:8.4-cli
    command: php -S 0.0.0.0:8000
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "${PHP_PORT:-8001}:8000"

  proxy:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${PROXY_PORT:-8000}:80"
    depends_on:
      - php
